name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  common-tests:
    name: Common tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          # Embedded interpreter in Abaqus 2026.
          - "3.10.5"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Gmsh system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglu1-mesa

      - name: Install abqhom
        run: python -m pip install .

      - name: Run common tests
        run: |
          python - <<'PY'
          import abqhom.tests as tests

          tests.run_python_tests()
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: common-test-report-python-${{ matrix.python-version }}
          path: abqhom_test_report_python.txt
          if-no-files-found: ignore
          retention-days: 7

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r doc/requirements.txt

      - name: Build documentation
        run: >-
          python -m sphinx -W --keep-going -b html
          doc/source doc/build/html

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Test the built wheel
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/python -c "import abqhom; print(abqhom.__version__)"
          .wheel-test/bin/abqhom-install-abaqus --help

      - name: Upload distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
